<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Auth Callback</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>body{margin:0;background:#0b1120;color:#e2e8f0;font-family:Helvetica,Arial,sans-serif;
display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
.box{max-width:640px;padding:2rem}code{display:block;word-break:break-all;background:#111827;
color:#38bdf8;padding:1rem;border-radius:8px;margin:1rem 0;font-size:14px}
button{background:#38bdf8;border:0;color:#0b1120;font-weight:700;padding:.6rem 1.2rem;border-radius:8px;cursor:pointer}</style>
</head><body><div class="box">
<h1>Authorized ✅</h1>
<p>Copy this and paste it back to Claude:</p>
<code id="u"></code>
<button onclick="navigator.clipboard.writeText(document.getElementById('u').textContent)">Copy</button>
<p style="color:#94a3b8;font-size:13px;margin-top:1.5rem">You can close this tab after copying.</p>
<script>document.getElementById('u').textContent=window.location.href;</script>
</div></body></html>
