# ---------------------------------------------------------------------------
# Lab 03 -- systemd drop-in for links.service on vm-web-01.
# Installed at /etc/systemd/system/links.service.d/10-keyvault.conf
# (then: systemctl daemon-reload && systemctl restart links).
#
# A drop-in EXTENDS the unit without editing it -- the Lab 02 service file is
# untouched. Two lines do the whole job:
#   - ExecStartPre runs the Key Vault fetch before the app starts.
#   - EnvironmentFile lines STACK, and later files win -- so the password
#     arrives from RAM (/run/links/db.env), layered on top of /etc/app.env,
#     which no longer contains one.
#   - The leading "-" on EnvironmentFile = tolerate a missing file. On boot
#     the RAM file doesn't exist yet; without the dash, systemd kills the
#     spawn before ExecStartPre ever runs the fetch.
# ---------------------------------------------------------------------------
[Service]
ExecStartPre=/usr/local/bin/fetch-db-pass.sh
EnvironmentFile=-/run/links/db.env
